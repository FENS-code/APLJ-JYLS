<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14211b"></stop>
      <stop offset="100%" stop-color="#0c1511"></stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="rgba(231,210,143,0.35)"></stop>
      <stop offset="100%" stop-color="transparent"></stop>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"></rect>
  <rect width="100%" height="100%" fill="url(#glow)"></rect>
  <!-- 左右淡淡祥云圈 -->
  <circle cx="80" cy="60" r="100" fill="rgba(231,210,143,0.25)"></circle>
  <circle cx="1120" cy="200" r="120" fill="rgba(231,210,143,0.20)"></circle>
  <!-- 标题文字 -->
  <g font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Heiti SC, sans-serif" text-anchor="middle">
    <text x="600" y="120" font-size="56" fill="#e7d28f" style="paint-order:stroke; stroke:#6f6333; stroke-width:1;">
      吉运招财 · 开启今日好气运
    </text>
    <text x="600" y="170" font-size="24" fill="#c9ba83">
      赞助推广 · 心诚则灵 行善聚福
    </text>
  </g>
  <!-- 外发光描边 -->
  <rect x="6" y="6" width="1188" height="228" rx="14" ry="14" fill="none" stroke="rgba(231,210,143,0.35)" stroke-width="2"></rect>
</svg>
